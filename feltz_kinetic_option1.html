<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FELTZ STUDIO // MONGKOL WONGSAKULYANON — COMMERCIAL PHOTOGRAPHY PORTFOLIO</title>
  <meta name="description" content="Feltz Studio — Mongkol Wongsakulyanon Commercial Photography Portfolio. Editorial Poster &amp; 3D Interactive Ring Showcase." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Anuphan:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       RESET & EDITORIAL COLOR SYSTEM (STRICT ZERO GOLD #FFD700 & ZERO AI CYAN)
       Inspired by Editorial Magazine Poster Reference + Warm Portrait Rim Light
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #0b0707;
      --bg-dark-card: #140c0c;
      --bg-dark-surface: #1c1010;
      --text-dark-main: #e8dcc8;
      --text-dark-white: #f7f3eb;
      --text-dark-sub: #a89a8e;
      --border-dark: rgba(232, 220, 200, 0.12);
      --border-crimson: rgba(201, 59, 43, 0.30);
      --border-crimson-strong: rgba(224, 79, 62, 0.52);

      --bg-light: #f4efe6;
      --bg-light-card: #fcfaf5;
      --bg-light-surface: #e9e1d4;
      --text-light-main: #161110;
      --text-light-sub: #574c46;
      --border-light: rgba(22, 17, 16, 0.12);
      --border-light-strong: rgba(201, 59, 43, 0.28);

      /* Deep Editorial Crimson & Warm Bone Cream */
      --accent-crimson: #c93b2b;
      --accent-vermilion: #e04f3e;
      --accent-deep-red: #7c1911;
      --editorial-cream: #e8dcc8;

      --font-display: "Anton", "Oswald", "Outfit", sans-serif;
      --font-condensed: "Oswald", "Outfit", sans-serif;
      --font-sans: "Outfit", "Prompt", "Anuphan", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-th: "Prompt", "Anuphan", sans-serif;
      --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
      --font-sign: "Caveat", cursive;

      --ring-radius: 375px;
    }

    @media (max-width: 768px) {
      :root {
        --ring-radius: 148px;
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-dark-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      overflow-y: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Strict Thai Letter Spacing Rule to Prevent Floating Vowels */
    :lang(th), .thai-text, .editorial-quote-th, .editorial-bio-th, .service-desc-th, .meta-sub, .process-desc-th, .contact-section, .field-label, .field-input, .field-select, .field-textarea, .submit-inquiry-btn {
      letter-spacing: 0 !important;
      word-spacing: normal !important;
    }

    /* ==========================================================================
       POINT 1: EDITORIAL TOP MASTHEAD (NO OPTION SWITCHERS)
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 32px;
      pointer-events: none;
      transition: all 0.35s ease;
    }

    .masthead-bar {
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0;
      border-bottom: none;
    }

    .masthead-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: rgba(244, 239, 230, 0.78);
      text-transform: uppercase;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
      padding: 4px 2px;
      border: none;
      transition: all 0.25s ease;
    }

    .top-nav.theme-light-active .masthead-left {
      background: transparent;
      color: #161110;
    }

    .masthead-center-year {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: rgba(244, 239, 230, 0.58);
      pointer-events: none;
    }

    .top-nav.theme-light-active .masthead-center-year {
      color: rgba(22, 17, 16, 0.58);
    }

    .masthead-left .sep {
      color: var(--accent-crimson);
      font-weight: 700;
    }

    .masthead-right-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: rgba(244, 239, 230, 0.82);
      text-transform: uppercase;
      background: transparent;
      padding: 4px 2px;
      border: none;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.25s ease;
    }

    .masthead-right-btn:hover {
      color: #ffffff;
    }

    .top-nav.theme-light-active .masthead-right-btn {
      background: transparent;
      color: #161110;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-vermilion);
      box-shadow: 0 0 8px var(--accent-vermilion);
      animation: pulseRed 2s infinite ease-in-out;
    }

    @keyframes pulseRed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.86); }
    }

    @media (max-width: 768px) {
      .top-nav {
        padding: 8px 14px;
      }
      .masthead-bar {
        padding-bottom: 6px;
      }
      .masthead-left {
        font-size: 9.5px;
        letter-spacing: 0.1em;
        padding: 4px 8px;
        gap: 6px;
      }
      .masthead-right-btn {
        font-size: 9.5px;
        letter-spacing: 0.08em;
        padding: 4px 8px;
        gap: 6px;
      }
    }

    /* ==========================================================================
       SIDE CATEGORY JUMPER & PROGRESS INDICATOR
       ========================================================================== */
    .side-indicator {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 850;
      display: flex;
      flex-direction: column;
      gap: 9px;
      pointer-events: auto;
    }

    .indicator-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px;
      justify-content: flex-end;
    }

    .indicator-dot span.idx-num {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: rgba(232, 220, 200, 0.45);
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .indicator-dot span.idx-bar {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(232, 220, 200, 0.30);
      transition: all 0.25s ease;
    }

    .indicator-dot:hover span.idx-num,
    .indicator-dot.active span.idx-num {
      opacity: 1;
      transform: translateX(0);
      color: var(--editorial-cream);
    }

    .indicator-dot.active span.idx-bar {
      height: 22px;
      background: var(--accent-vermilion);
    }

    .side-indicator.theme-light-active .indicator-dot span.idx-num {
      color: rgba(22, 17, 16, 0.45);
    }

    .side-indicator.theme-light-active .indicator-dot:hover span.idx-num,
    .side-indicator.theme-light-active .indicator-dot.active span.idx-num {
      color: #161110;
    }

    .side-indicator.theme-light-active .indicator-dot span.idx-bar {
      background: rgba(22, 17, 16, 0.24);
    }

    .side-indicator.theme-light-active .indicator-dot.active span.idx-bar {
      background: var(--accent-crimson);
    }

    @media (max-width: 768px) {
      .side-indicator {
        right: 8px;
        gap: 5px;
      }
      .indicator-dot span.idx-num {
        display: none;
      }
    }

    /* ==========================================================================
       MAIN VIEWPORT CONTAINER & KINETIC SECTIONS
       ========================================================================== */
    .viewport-canvas {
      width: 100vw;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      position: relative;
    }

    .viewport-canvas::-webkit-scrollbar {
      display: none;
    }
    .viewport-canvas {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .kinetic-section {
      width: 100vw;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s ease;
    }

    .kinetic-section[data-theme="dark"] {
      background-color: var(--bg-dark);
      color: var(--text-dark-main);
    }

    .kinetic-section[data-theme="light"] {
      background-color: var(--bg-light);
      color: var(--text-light-main);
    }

    .ambient-glow {
      position: absolute;
      width: 760px;
      height: 760px;
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.36;
      background: radial-gradient(circle, var(--glow-color, rgba(201, 59, 43, 0.32)) 0%, transparent 68%) !important;
    }

    /* ==========================================================================
       POINT 3: SECTION 00 — VANTA//9 INSPIRED 3D MACBOOK STUDIO PRESENTATION
       ========================================================================== */
    .intro-section {
      background:
        radial-gradient(ellipse 88% 76% at 32% 28%, rgba(124, 28, 14, 0.92) 0%, rgba(68, 14, 8, 0.85) 42%, rgba(18, 4, 3, 0.98) 80%, #080202 100%),
        linear-gradient(180deg, #3a0b06 0%, #080202 100%);
      color: var(--editorial-cream);
      padding: 40px 28px 14px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .vanta-stage-shell {
      width: 100%;
      max-width: 1420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    /* 1. Top External Meta Strip (Hidden for pure VANTA//9 gallery space) */
    .vanta-external-top {
      display: none;
    }

    /* 2. Giant Architectural Wall Typography Behind MacBook (Like VANTA//9) */
    .vanta-wall-backdrop {
      position: absolute;
      top: 37%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      text-align: center;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .vanta-wall-word {
      font-family: var(--font-display);
      font-size: clamp(5.8rem, 17.6vw, 17.6rem);
      font-weight: 400;
      color: #f3efe8;
      text-transform: uppercase;
      letter-spacing: 0.008em;
      line-height: 0.82;
      white-space: nowrap;
      opacity: 0.96;
      text-shadow: 0 24px 70px rgba(0, 0, 0, 0.58);
    }

    /* 3. Center 3D Blender MacBook Hardware Rig + Pedestal (WebGL GLTF Stage) */
    .macbook-rig-arena {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 6;
      margin-top: 0;
    }

    .webgl-macbook-stage {
      position: relative;
      width: min(94vw, 1260px);
      height: min(82vh, 750px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      cursor: ns-resize;
    }

    .webgl-macbook-stage canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      filter: drop-shadow(0 36px 70px rgba(0, 0, 0, 0.92));
    }

    .webgl-slide-hud {
      display: none;
    }

    .command-webgl-stage {
      position: relative;
      width: min(74vw, 840px);
      height: min(38vh, 335px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      cursor: ns-resize;
      margin-top: -6px;
    }

    .command-webgl-stage canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      filter: drop-shadow(0 22px 45px rgba(0, 0, 0, 0.85));
    }

    @media (max-width: 768px) {
      .webgl-macbook-stage {
        width: 100vw;
        height: 68dvh;
        max-height: 640px;
      }

      .webgl-slide-hud {
        margin-top: -6px;
        padding: 4px 8px;
      }

      .webgl-slide-hud .hud-label {
        display: none;
      }

      .command-webgl-stage {
        width: 98vw;
        height: 27dvh;
        max-height: 245px;
      }
    }

    /* Camera Notch at Top Center of Bezel */
    .macbook-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 14px;
      background: #09090b;
      border-radius: 0 0 8px 8px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .macbook-notch::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1c2b38;
      box-shadow: 0 0 3px rgba(74, 222, 128, 0.6);
    }

    .macbook-notch::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #22c55e;
      opacity: 0.85;
    }

    /* Screen Display Viewport Inside Lid (Opaque Solid Dark so Wall Text Never Bleeds Through) */
    .macbook-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0c0707;
      border-radius: 8px 8px 2px 2px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(232, 220, 200, 0.14);
    }

    /* Top OS Status Bar Inside Screen (Left-Aligned Title so Camera Notch Never Covers Text) */
    .screen-os-bar {
      height: 26px;
      background: #150b0b;
      border-bottom: 1px solid rgba(201, 59, 43, 0.30);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(232, 220, 200, 0.75);
      flex-shrink: 0;
      z-index: 20;
    }

    .os-left-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .os-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .os-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(232, 220, 200, 0.25);
    }

    .os-dots span:first-child {
      background: var(--accent-vermilion);
    }

    .screen-slide-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .screen-tab-btn {
      background: none;
      border: 1px solid transparent;
      color: rgba(232, 220, 200, 0.52);
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .screen-tab-btn.active,
    .screen-tab-btn:hover {
      color: var(--editorial-cream);
      border-color: rgba(201, 59, 43, 0.45);
      background: rgba(201, 59, 43, 0.18);
    }

    /* Auto-Scrolling Inner Viewport */
    .screen-scroll-viewport {
      position: relative;
      width: 100%;
      flex: 1;
      height: calc(100% - 26px);
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: #0c0707;
    }

    .screen-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    .screen-scroll-track {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Slide 1 Inside MacBook: Photographer Identity & Portrait (Full 100% Screen Height) */
    .screen-page-identity {
      position: relative;
      height: 100%;
      min-height: 100%;
      flex-shrink: 0;
      padding: 20px 26px;
      display: grid;
      grid-template-columns: 1fr 225px 1.15fr;
      gap: 18px;
      align-items: center;
      background:
        radial-gradient(circle at 48% 45%, rgba(185, 38, 25, 0.30) 0%, #0c0707 72%);
      border-bottom: 1px solid rgba(201, 59, 43, 0.30);
    }

    .screen-id-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 4;
    }

    .screen-id-kicker {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      color: var(--accent-vermilion);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .screen-id-headline {
      font-family: var(--font-condensed);
      font-size: clamp(1.3rem, 2vw, 1.85rem);
      font-weight: 700;
      color: var(--editorial-cream);
      line-height: 1.02;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .screen-quote-th {
      font-family: var(--font-th);
      font-size: 11.5px;
      color: #d8cabe;
      line-height: 1.45;
      border-left: 2px solid var(--accent-crimson);
      padding-left: 10px;
      letter-spacing: 0 !important;
    }

    .screen-sign {
      font-family: var(--font-sign);
      font-size: 20px;
      color: var(--editorial-cream);
      transform: rotate(-3deg);
      display: inline-block;
    }

    /* Center Cutout Portrait Inside Screen */
    .screen-id-center {
      position: relative;
      height: 235px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 3;
    }

    .screen-crimson-sun {
      position: absolute;
      width: 185px;
      height: 185px;
      border-radius: 50%;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 38% 35%, rgba(218, 60, 44, 0.85) 0%, rgba(140, 22, 14, 0.58) 58%, transparent 100%);
      border: 1px solid rgba(224, 79, 62, 0.35);
      box-shadow: 0 0 40px rgba(201, 59, 43, 0.45);
    }

    .screen-portrait-img {
      position: relative;
      z-index: 3;
      height: 230px;
      width: auto;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.85));
    }

    /* Right Bio & 3 Stats Inside Screen */
    .screen-id-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 4;
    }

    .screen-person-name {
      font-family: var(--font-condensed);
      font-size: clamp(1.25rem, 1.9vw, 1.7rem);
      font-weight: 700;
      color: var(--editorial-cream);
      line-height: 1.04;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .screen-person-role {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--accent-vermilion);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .screen-bio-th {
      font-family: var(--font-th);
      font-size: 11px;
      color: var(--text-dark-sub);
      line-height: 1.45;
      letter-spacing: 0 !important;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(201, 59, 43, 0.24);
    }

    .screen-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .screen-stat-box {
      background: rgba(22, 12, 12, 0.85);
      border: 1px solid rgba(201, 59, 43, 0.25);
      border-radius: 5px;
      padding: 6px 8px;
    }

    .screen-stat-num {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 800;
      color: var(--editorial-cream);
      line-height: 1.05;
    }

    .screen-stat-lbl {
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--text-dark-sub);
      letter-spacing: 0.06em;
      line-height: 1.2;
      margin-top: 2px;
    }

    /* Slide 2 Inside MacBook: WHAT I DO (4 Services Grid + Enterprise Clients) */
    .screen-page-services {
      height: 100%;
      min-height: 100%;
      flex-shrink: 0;
      padding: 22px 26px;
      background:
        radial-gradient(circle at 50% 20%, rgba(185, 38, 25, 0.22) 0%, #0e0808 75%),
        #0e0808;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .screen-sec-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(201, 59, 43, 0.28);
      padding-bottom: 6px;
    }

    .screen-sec-title {
      font-family: var(--font-condensed);
      font-size: 16px;
      font-weight: 700;

    /* Giant Kinetic Rolling Typography at Bottom */
    .giant-kinetic-title-wrap {
      position: absolute;
      bottom: 22px;
      left: 44px;
      right: 44px;
      padding: 12px 0 6px 0;
      border-top: 1px solid rgba(201, 59, 43, 0.22);
      z-index: 5;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      perspective: 1000px;
    }

    .giant-kinetic-title {
      font-family: var(--font-display);
      font-size: clamp(4.8rem, 13.5vw, 11.8rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 0.90;
      padding-top: 0.06em;
      padding-bottom: 0.12em;
      text-transform: uppercase;
      display: flex;
      white-space: nowrap;
      user-select: none;
    }

    .kinetic-section[data-theme="dark"] .giant-kinetic-title {
      color: rgba(232, 220, 200, 0.19);
    }

    .kinetic-section[data-theme="light"] .giant-kinetic-title {
      color: rgba(22, 17, 16, 0.15);
    }

    .kinetic-char-box {
      display: inline-block;
      overflow: visible;
      transform-style: preserve-3d;
      vertical-align: bottom;
    }

    .kinetic-char {
      display: inline-block;
      transform: translate3d(0, 120%, 0) rotateX(-80deg) scale(0.92);
      opacity: 0;
      transition: none;
      will-change: transform, opacity;
      padding-bottom: 0.12em;
    }

    .kinetic-section.is-in-view .kinetic-char {
      transform: translate3d(0, 0%, 0) rotateX(0deg) scale(1);
      opacity: 1;
      transition: transform 0.95s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.75s ease;
    }

    /* 3D Ring Stage & Cards */
    .ring-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1100px;
      perspective-origin: 50% 50%;
      z-index: 10;
      cursor: grab;
      touch-action: pan-y;
      margin-top: -6vh;
    }

    .kinetic-section:not(.is-near-view) .ring-stage {
      visibility: hidden;
      pointer-events: none;
    }

    .ring-stage:active {
      cursor: grabbing;
    }

    .ring-pivot {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      transform: rotateX(-12deg) rotateZ(-3deg) rotateY(0deg);
      will-change: transform;
    }

    .ring-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--card-w, 224px);
      height: var(--card-h, 150px);
      margin-left: calc(var(--card-w, 224px) / -2);
      margin-top: calc(var(--card-h, 150px) / -2);
      transform-style: preserve-3d;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52);
      cursor: pointer;
      overflow: hidden;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }

    .kinetic-section[data-theme="dark"] .ring-card {
      border: 1px solid rgba(232, 220, 200, 0.24);
      background: #181010;
    }

    .kinetic-section[data-theme="light"] .ring-card {
      border: 1px solid rgba(22, 17, 16, 0.20);
      background: #e6dfd3;
    }

    .ring-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      border-radius: 7px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }

    .ring-card:hover img {
      transform: scale(1.05);
    }

    /* Desktop Card Aspect Ratios */
    .ring-card.ratio-landscape {
      --card-w: 224px;

    // =========================================================================
    // 3D RING CONTROLLER (AUTO SPIN + TOUCH INERTIA + HOVER/TOUCH PAUSE)
    // =========================================================================
    function setupRingController(cat, stageElem, pivotElem, catIdx) {
      const cards = Array.from(pivotElem.querySelectorAll(".ring-card"));
      const state = {
        cat,
        catIdx,
        pivot: pivotElem,
        cards,
        currentRotation: 0,
        velocity: 0,
        isDragging: false,
        isPaused: false,
        startX: 0,
        startY: 0,
        lastX: 0,
        dragDistance: 0,
        autoSpinSpeed: 0.16,
        isActiveSection: false,
        isNearView: (catIdx === 0)
      };

      ringControllers.push(state);

      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        stageElem.addEventListener("mouseenter", () => { state.isPaused = true; });
        stageElem.addEventListener("mouseleave", () => {
          if (!state.isDragging) state.isPaused = false;
        });
      }

      const onPointerDown = (e) => {
        state.isDragging = true;
        state.isPaused = true;
        state.startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        state.startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        state.lastX = state.startX;
        state.dragDistance = 0;
        state.velocity = 0;
      };

      const onPointerMove = (e) => {
        if (!state.isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        const dx = clientX - state.lastX;
        const dy = Math.abs(clientY - state.startY);
        const absX = Math.abs(clientX - state.startX);

        if (dy > absX && dy > 6) {
          state.isDragging = false;
          state.isPaused = false;
          return;
        }

        state.dragDistance += Math.abs(dx);

        if (Math.abs(dx) > dy && state.dragDistance > 6) {
          if (e.cancelable && e.type && e.type.startsWith("touch")) {
            e.preventDefault();
          }
        }

        state.velocity = dx * 0.42;
        state.currentRotation += state.velocity;
        state.lastX = clientX;
      };

      const onPointerUp = () => {
        if (!state.isDragging && !state.isPaused) return;
        state.isDragging = false;
        setTimeout(() => {
          const isFinePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
          if (!isFinePointer || !stageElem.matches(":hover")) {
            state.isPaused = false;
          }
        }, 80);
      };

      stageElem.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove, { passive: false });
      window.addEventListener("mouseup", onPointerUp);

      stageElem.addEventListener("touchstart", onPointerDown, { passive: true });
      window.addEventListener("touchmove", onPointerMove, { passive: false });
      window.addEventListener("touchend", onPointerUp, { passive: true });
      window.addEventListener("touchcancel", onPointerUp, { passive: true });

      cards.forEach((cardEl, pIdx) => {
        cardEl.addEventListener("click", () => {
          if (state.dragDistance < 8 && !isLightboxSpatialAnimating) {
            triggerSpatialLightbox(cat, pIdx, cardEl);
          }
        });
      });
    }

    // Animation Loop (With Inclined Elliptical Tilt & Front-Arc Depth Culling on Mobile so Cards Never Clump)
    function animateRings() {
      const isMobile = window.innerWidth <= 768;
      const tiltX = isMobile ? -15 : -12;
      const tiltZ = isMobile ? -3.5 : -3.5;

      ringControllers.forEach(ctrl => {
        if (!ctrl.isNearView) return;

        if (!ctrl.isDragging) {
          if (Math.abs(ctrl.velocity) > 0.04) {
            ctrl.currentRotation += ctrl.velocity;
            ctrl.velocity *= 0.94;
          } else if (!ctrl.isPaused) {
            ctrl.currentRotation += ctrl.autoSpinSpeed;
          }
        }

        ctrl.pivot.style.transform = `rotateX(${tiltX}deg) rotateZ(${tiltZ}deg) rotateY(${ctrl.currentRotation}deg)`;

        // Depth Culling per Card so Front Cards Stand Out Cleanly Without Back-Row Clutter
        const stepDeg = 360 / ctrl.cards.length;
        ctrl.cards.forEach((cardEl, idx) => {
          if (cardEl === activeClickedCardEl) return;
          const totalDeg = (idx * stepDeg) + ctrl.currentRotation;
          const rad = (totalDeg * Math.PI) / 180;
          const depth = Math.cos(rad); // +1 = Front Center, 0 = Left/Right Edge, -1 = Back Center
          cardEl.style.zIndex = String(Math.round((depth + 1) * 50));

          if (isMobile) {
            if (depth > 0.45) {
              cardEl.style.opacity = "1";
              cardEl.style.pointerEvents = "auto";
            } else if (depth > -0.05) {
              cardEl.style.opacity = "0.78";
              cardEl.style.pointerEvents = "auto";
            } else {
              cardEl.style.opacity = "0.14";
              cardEl.style.pointerEvents = "none";
            }
          } else {
            if (depth >= 0) {
              cardEl.style.opacity = "1";
              cardEl.style.pointerEvents = "auto";
            } else {
              const backOp = Math.max(0.28, 0.28 + (depth + 1) * 0.52);
              cardEl.style.opacity = backOp.toFixed(2);
              cardEl.style.pointerEvents = "auto";
            }
          }
        });
      });

      requestAnimationFrame(animateRings);
    }

    // =========================================================================
    // COVER MACBOOK AUTO-SCROLL PRESENTATION ENGINE (LIKE VANTA//9 REF)
    // =========================================================================
    let coverLaptopPaused = false;
    let coverLaptopDir = 1; // 1 = scrolling down slowly, -1 = returning up
    let coverLaptopHoldTimer = 0;

    function scrollCoverLaptopTo(pageIdx) {
      const vp = document.getElementById("cover-screen-viewport");
      const btnId = document.getElementById("tab-btn-id");
      const btnSrv = document.getElementById("tab-btn-srv");
      if (!vp) return;

      coverLaptopPaused = true;
      const targetTop = pageIdx === 0 ? 0 : vp.scrollHeight - vp.clientHeight;
      vp.scrollTo({ top: targetTop, behavior: "smooth" });

      if (btnId && btnSrv) {
        btnId.classList.toggle("active", pageIdx === 0);
        btnSrv.classList.toggle("active", pageIdx === 1);
      }

      setTimeout(() => {
        coverLaptopPaused = false;
        coverLaptopHoldTimer = 90;
      }, 3200);
    }

    function setupCoverLaptopAutoScroll() {
      const vp = document.getElementById("cover-screen-viewport");
      const btnId = document.getElementById("tab-btn-id");
      const btnSrv = document.getElementById("tab-btn-srv");
      if (!vp) return;

      // Hold on Mongkol's Profile for ~2.2 seconds after lid opens before gliding down
      coverLaptopHoldTimer = 135;

      vp.addEventListener("mouseenter", () => { coverLaptopPaused = true; });
      vp.addEventListener("mouseleave", () => { coverLaptopPaused = false; });
      vp.addEventListener("touchstart", () => { coverLaptopPaused = true; }, { passive: true });
      vp.addEventListener("touchend", () => {
        setTimeout(() => { coverLaptopPaused = false; }, 2200);
      }, { passive: true });

      function stepLaptopScroll() {
        const introSec = document.getElementById("sec-intro");
        const isCoverVisible = introSec && introSec.classList.contains("is-in-view");

        if (isCoverVisible && !coverLaptopPaused) {
          const maxScroll = vp.scrollHeight - vp.clientHeight;
          if (maxScroll > 12) {
            if (coverLaptopHoldTimer > 0) {
              coverLaptopHoldTimer--;
            } else {
              vp.scrollTop += coverLaptopDir * 0.55;

              if (vp.scrollTop >= maxScroll - 2) {
                vp.scrollTop = maxScroll;
                coverLaptopDir = -1;
                coverLaptopHoldTimer = 140; // Pause on WHAT I DO
              } else if (vp.scrollTop <= 2) {
                vp.scrollTop = 0;
                coverLaptopDir = 1;
                coverLaptopHoldTimer = 150; // Pause on Profile Identity
              }
            }

            if (btnId && btnSrv) {
              const onSecondHalf = vp.scrollTop > maxScroll * 0.45;
              btnId.classList.toggle("active", !onSecondHalf);
              btnSrv.classList.toggle("active", onSecondHalf);
            }
          }
        }
        requestAnimationFrame(stepLaptopScroll);
      }

      requestAnimationFrame(stepLaptopScroll);
    }

    function scrollToCategory(idx) {
      const allSections = document.querySelectorAll(".kinetic-section");
      if (allSections[idx]) {
        const vp = document.getElementById("viewport-canvas");
        if (vp) {
          vp.scrollTo({
            top: allSections[idx].offsetTop,
            behavior: "smooth"
          });
        } else {
          allSections[idx].scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }

    function setupIntersectionObserver() {
      const allSections = document.querySelectorAll(".kinetic-section");
      const dots = document.querySelectorAll(".indicator-dot");

      viewport.addEventListener("scroll", () => {
        ringControllers.forEach(st => {
          st.isPaused = false;
          st.isDragging = false;
        });
      }, { passive: true });

      const inViewObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const idx = parseInt(entry.target.getAttribute("data-index"), 10);
          if (entry.isIntersecting) {
            entry.target.classList.add("is-in-view");

            if (window.setFeltz3DMacBookInView) {
              if (idx === 0) window.setFeltz3DMacBookInView("cover", true);
              if (idx === 9) window.setFeltz3DMacBookInView("command", true);
            }

            ringControllers.forEach(st => {
              st.isPaused = false;
              st.isDragging = false;
            });

            if (idx > 0 && ringControllers[idx - 1]) {
              ringControllers[idx - 1].isActiveSection = true;
            }

            const isLight = entry.target.getAttribute("data-theme") === "light";
            sideNav.classList.toggle("theme-light-active", isLight);
            topNav.classList.toggle("theme-light-active", isLight);

            dots.forEach((d, dIdx) => {
              d.classList.toggle("active", dIdx === idx);
            });
          } else {
            entry.target.classList.remove("is-in-view");
            if (window.setFeltz3DMacBookInView) {
              if (idx === 0) window.setFeltz3DMacBookInView("cover", false);
              if (idx === 9) window.setFeltz3DMacBookInView("command", false);
            }
            if (idx > 0 && ringControllers[idx - 1]) {
              ringControllers[idx - 1].isActiveSection = false;
            }
          }
        });
      }, {
        root: viewport,
        threshold: 0.82
      });

      const nearViewObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const idx = parseInt(entry.target.getAttribute("data-index"), 10);
          const isNear = entry.isIntersecting;
          entry.target.classList.toggle("is-near-view", isNear);
          if (idx > 0 && ringControllers[idx - 1]) {
            ringControllers[idx - 1].isNearView = isNear;
          }
        });
      }, {
        root: viewport,
        rootMargin: "100% 0px 100% 0px",
        threshold: 0.01
      });

      allSections.forEach(s => {
        inViewObserver.observe(s);
        nearViewObserver.observe(s);
      });
    }

    // =========================================================================
    // SPATIAL FLIP FLY-OUT LIGHTBOX ANIMATION ENGINE
    // =========================================================================
    const lbOverlay = document.getElementById("lightbox-overlay");
    const lbFlyingStage = document.getElementById("lightbox-flying-stage");
    const lbFlyingImg = document.getElementById("lightbox-flying-img");
    const lbCat = document.getElementById("lb-cat");
    const lbTitle = document.getElementById("lb-title");

    function triggerSpatialLightbox(cat, photoIdx, cardEl) {
      isLightboxSpatialAnimating = true;
      currentLightboxCat = cat;
      currentLightboxIdx = photoIdx;
      activeClickedCardEl = cardEl;

      const photo = cat.photos[photoIdx];
      activeOriginRect = cardEl.getBoundingClientRect();
      cardEl.style.opacity = "0";

      lbFlyingImg.src = photo.full;
      lbFlyingStage.style.transition = "none";
      lbFlyingStage.style.left = `${activeOriginRect.left}px`;
      lbFlyingStage.style.top = `${activeOriginRect.top}px`;
      lbFlyingStage.style.width = `${activeOriginRect.width}px`;
      lbFlyingStage.style.height = `${activeOriginRect.height}px`;
      lbFlyingStage.style.transform = "scale(0.96) perspective(900px) rotateY(6deg)";
      lbFlyingStage.style.display = "block";

      lbCat.textContent = `${cat.num} // ${cat.label}`;
      lbTitle.textContent = `${photo.title} (${photoIdx + 1} / ${cat.photos.length})`;

      lbOverlay.classList.add("is-active");

      const ratio = photo.wRatio || 1.5;
      const isPortrait = ratio < 0.9;
      let targetW = Math.min(window.innerWidth * 0.88, isPortrait ? 560 : 1050);
      let targetH = targetW / ratio;

      if (targetH > window.innerHeight * 0.80) {
        targetH = window.innerHeight * 0.80;
        targetW = targetH * ratio;
      }

      const targetLeft = (window.innerWidth - targetW) / 2;
      const targetTop = (window.innerHeight - targetH) / 2;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          lbFlyingStage.style.transition = "left 0.54s cubic-bezier(0.16, 1, 0.3, 1), top 0.54s cubic-bezier(0.16, 1, 0.3, 1), width 0.54s cubic-bezier(0.16, 1, 0.3, 1), height 0.54s cubic-bezier(0.16, 1, 0.3, 1), transform 0.54s cubic-bezier(0.16, 1, 0.3, 1)";
          lbFlyingStage.style.left = `${targetLeft}px`;
          lbFlyingStage.style.top = `${targetTop}px`;
          lbFlyingStage.style.width = `${targetW}px`;
          lbFlyingStage.style.height = `${targetH}px`;
          lbFlyingStage.style.transform = "scale(1) rotateY(0deg)";

          setTimeout(() => {
            isLightboxSpatialAnimating = false;
          }, 560);
        });
      });
    }

    function closeLightboxSpatial() {
      if (isLightboxSpatialAnimating || !activeClickedCardEl) {
        lbOverlay.classList.remove("is-active");
        lbFlyingStage.style.display = "none";
        if (activeClickedCardEl) activeClickedCardEl.style.opacity = "1";
        return;
      }

      isLightboxSpatialAnimating = true;
      lbOverlay.classList.remove("is-active");

      lbFlyingStage.style.transition = "left 0.42s cubic-bezier(0.22, 1, 0.36, 1), top 0.42s cubic-bezier(0.22, 1, 0.36, 1), width 0.42s cubic-bezier(0.22, 1, 0.36, 1), height 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1)";
      lbFlyingStage.style.left = `${activeOriginRect.left}px`;
      lbFlyingStage.style.top = `${activeOriginRect.top}px`;
      lbFlyingStage.style.width = `${activeOriginRect.width}px`;
      lbFlyingStage.style.height = `${activeOriginRect.height}px`;
      lbFlyingStage.style.transform = "scale(0.96) perspective(900px) rotateY(6deg)";

      setTimeout(() => {
        lbFlyingStage.style.display = "none";
        if (activeClickedCardEl) {
          activeClickedCardEl.style.opacity = "1";
        }
        activeClickedCardEl = null;
        activeOriginRect = null;
        isLightboxSpatialAnimating = false;
      }, 430);
    }

    function navigateLightbox(dir) {
      if (!currentLightboxCat) return;
      const len = currentLightboxCat.photos.length;
      currentLightboxIdx = (currentLightboxIdx + dir + len) % len;

      const p = currentLightboxCat.photos[currentLightboxIdx];
      lbFlyingImg.src = p.full;
      lbTitle.textContent = `${p.title} (${currentLightboxIdx + 1} / ${len})`;

      const ratio = p.wRatio || 1.5;
      const isPortrait = ratio < 0.9;
      let targetW = Math.min(window.innerWidth * 0.88, isPortrait ? 560 : 1050);
      let targetH = targetW / ratio;

      if (targetH > window.innerHeight * 0.80) {
        targetH = window.innerHeight * 0.80;
        targetW = targetH * ratio;
      }

      const targetLeft = (window.innerWidth - targetW) / 2;
      const targetTop = (window.innerHeight - targetH) / 2;

      lbFlyingStage.style.transition = "left 0.32s ease, top 0.32s ease, width 0.32s ease, height 0.32s ease";
      lbFlyingStage.style.left = `${targetLeft}px`;
      lbFlyingStage.style.top = `${targetTop}px`;
      lbFlyingStage.style.width = `${targetW}px`;
      lbFlyingStage.style.height = `${targetH}px`;
    }

    function handleLightboxBackdrop(e) {
      if (e.target === lbOverlay) {
        closeLightboxSpatial();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (lbOverlay.classList.contains("is-active")) {
        if (e.key === "Escape") closeLightboxSpatial();
        if (e.key === "ArrowLeft") navigateLightbox(-1);
        if (e.key === "ArrowRight") navigateLightbox(1);
      }
    });

    // Dynamic Angle & Radius Update on Resize (360 / cat.photos.length)
    window.addEventListener("resize", () => {
      const isMobile = window.innerWidth <= 768;
      const radius = isMobile ? 198 : 375;
      ringControllers.forEach(ctrl => {
        const stepDeg = 360 / ctrl.cat.photos.length;
        ctrl.cards.forEach((c, idx) => {
          c.style.transform = `rotateY(${idx * stepDeg}deg) translateZ(${radius}px)`;
        });
      });
    });

    // Boot
    window.addEventListener("DOMContentLoaded", () => {
      initDOM();
      setupIntersectionObserver();
      if (window.initFeltz3DMacBookStages) {
        window.initFeltz3DMacBookStages();
      }
      requestAnimationFrame(animateRings);
    });
  </script>
